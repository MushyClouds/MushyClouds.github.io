        /* ---------------------- CONTAINER LAYOUT ----------------------*/
        /* defining layout (the grid) */
        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "main directory"
                "footer footer";
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            background-color: Transparent;
            padding: 5px;
            overflow: hidden;
        }

        /* what a container is supposed to be like */
        .container div {
            padding: 5px;
            border: 10px;
        }

        /* Each container in the layout */
        .container div.header {
            grid-area: header;
            text-align: center;
            background-color: DarkGoldenRod;
            color: White;
        }

        .container div.main {
            grid-area: main;
            background-color: Honeydew;
            color: Olive;
        }

        .container div.directory {
            grid-area: directory;
            background-color: Olive;
	    text-align: right;
        }
	.container div.directory h3,

	    text-align: center;
	
	}

        .container div.footer {
            grid-area: footer;
            text-align: center;
            background-color: Brown;
        }
    </style>
</head>
